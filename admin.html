<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Toko</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2a33;--muted:#5b7480;--snow:#f7fbfc;--frost:#e1f0f5;--line:#cfe0e7;--chili:#d62839;--chili-d:#b01e2d;--ok:#1f7a4d;--turmeric:#f4b400;--white:#fff;
--display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--snow);color:var(--ink);font:400 15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1,h2{font-family:var(--display);letter-spacing:-.02em;margin:0}
.login{max-width:380px;margin:12vh auto;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:12px}
.login h1{font-size:28px}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
label small{font-weight:400;color:var(--muted)}
.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--white)}
.in:focus{border-color:var(--ink);outline:none}
textarea.in{min-height:80px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--white)}
.btn.red{background:var(--chili)}.btn.red:hover{background:var(--chili-d)}
.btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--chili-d);font-size:14px}
.bar{background:var(--ink);color:var(--white)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:12px 16px}
.bar h2{font-size:20px;margin-right:auto}
.tabs{display:flex;gap:6px;margin:16px 0}
.tab{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:8px 18px;font-weight:700}
.tab[aria-selected=true]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.row .grow{flex:1}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ord{display:grid;gap:8px}
.ord-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ord-h strong{font-size:16px}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--frost)}
.pill.ok{background:#d9f2e4;color:var(--ok)}.pill.bad{background:#fde1e4;color:var(--chili-d)}.pill.wait{background:#fff0c2;color:#7a5600}
.muted{color:var(--muted);font-size:13px}
.ord ul{margin:0;padding-left:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts select{width:auto}
table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--frost);font-size:13px}
td img,.th{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--frost);display:block}
.tbl{overflow-x:auto}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100dvh - 20px)}
dialog::backdrop{background:rgba(15,42,51,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-size:20px}
.db{padding:16px 18px;display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;background:var(--frost)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:99}
</style>
</head>
<body>
<script>
/* Penampil error: jika halaman putih, pesan penyebabnya tampil di layar */
(function () {
  var locked = false;
  function show(msg) {
    var d = document.getElementById('bootErr');
    if (!d) {
      d = document.createElement('div'); d.id = 'bootErr';
      d.style.cssText = 'margin:16px;padding:14px;border:2px solid #d62839;border-radius:12px;background:#fde1e4;color:#7a0e1a;font:14px/1.5 system-ui,sans-serif;white-space:pre-wrap;word-break:break-word';
      (document.body || document.documentElement).insertBefore(d, (document.body || document.documentElement).firstChild);
    }
    d.textContent = 'Halaman gagal dimuat:\n' + msg;
  }
  window.__showBootError = function (msg) { locked = true; show(msg); };
  window.addEventListener('error', function (e) {
    if (locked) return;
    var t = e.target;
    if (t && t !== window && t.tagName && t.tagName !== 'SCRIPT') return; // abaikan gambar/font yang gagal
    var file = e.filename || (t && t.src) || '';
    var msg = (e.message || 'File gagal dimuat') + (file ? '\n' + file + (e.lineno ? ':' + e.lineno : '') : '');
    if (/firebase-config/.test(file)) msg += '\n\nKemungkinan ada salah ketik di public/js/firebase-config.js (kurang koma atau tanda kutip). Periksa lagi barisnya.';
    show(msg);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    if (locked) return;
    show(String((e.reason && e.reason.message) || e.reason));
  });
})();
</script>

<!-- Login -->
<div id="loginView" class="login" hidden>
  <h1>Admin toko</h1>
  <label>Email<input class="in" id="email" type="email" autocomplete="username"></label>
  <label>Kata sandi<input class="in" id="pass" type="password" autocomplete="current-password"></label>
  <button class="btn red" id="loginBtn">Masuk</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- App -->
<div id="appView" hidden>
  <div class="bar"><div class="wrap">
    <h2 id="barName">Admin</h2>
    <a href="./" style="color:#cfe;font-weight:600" target="_blank">Lihat toko</a>
    <button class="btn ghost sm" id="logoutBtn">Keluar</button>
  </div></div>

  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="orders" aria-selected="true">Pesanan</button>
      <button class="tab" role="tab" data-tab="products" aria-selected="false">Produk</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">Pengaturan</button>
    </div>

    <!-- Orders -->
    <section id="tab-orders">
      <div class="row">
        <label class="grow" style="max-width:260px"><span class="sr" style="position:absolute;left:-9999px">Filter</span>
          <select class="in" id="ordFilter">
            <option value="all">Semua pesanan</option>
            <option value="todo">Perlu diproses (sudah dibayar)</option>
            <option value="unpaid">Belum dibayar</option>
            <option value="dikirim">Dalam pengiriman</option>
            <option value="selesai">Selesai</option>
            <option value="batal">Batal / kedaluwarsa</option>
          </select>
        </label>
        <span class="muted" id="ordCount"></span>
      </div>
      <div id="ordList"></div>
    </section>

    <!-- Products -->
    <section id="tab-products" hidden>
      <div class="row">
        <button class="btn red" id="addProd">Tambah produk</button>
        <button class="btn ghost" id="seedProd">Isi contoh produk</button>
        <span class="muted" id="prodCount"></span>
      </div>
      <div class="tbl"><table>
        <thead><tr><th></th><th>Produk</th><th>Harga</th><th>Stok</th><th>Status</th><th></th></tr></thead>
        <tbody id="prodBody"></tbody>
      </table></div>
    </section>

    <!-- Settings -->
    <section id="tab-settings" hidden>
      <div class="card" style="display:grid;gap:12px;max-width:640px">
        <h2 style="font-size:20px">Pengaturan toko</h2>
        <label>Nama toko<input class="in" id="sName"></label>
        <label>Judul besar di beranda<input class="in" id="sTag"></label>
        <label>Kalimat pendukung<input class="in" id="sSub"></label>
        <label>Pengumuman di bagian atas <small>(kosongkan jika tidak ada)</small><input class="in" id="sAnn"></label>
        <label>Catatan pengiriman <small>(tampil sebagai label di beranda)</small><input class="in" id="sNote"></label>
        <label>Nomor WhatsApp toko <small>(format 628xxxxxxxxxx)</small><input class="in" id="sWa" inputmode="tel"></label>
        <div class="two">
          <label>Minimal belanja (Rp)<input class="in" id="sMin" type="number" min="0"></label>
          <label>Gratis ongkir mulai (Rp) <small>0 = tidak ada</small><input class="in" id="sFree" type="number" min="0"></label>
        </div>
        <label>Area pengiriman &amp; ongkir <small>Satu baris satu area, format: Nama area | ongkir</small>
          <textarea class="in" id="sAreas" style="min-height:120px" placeholder="Area A | 15000&#10;Area B | 25000"></textarea>
        </label>
        <div class="row" style="margin:0"><button class="btn red" id="saveSettings">Simpan pengaturan</button><span class="err" id="sErr"></span></div>
      </div>
    </section>
  </div>
</div>

<!-- Product dialog -->
<dialog id="prodDlg">
  <div class="dh"><h2 id="pdTitle">Produk</h2><button class="btn ghost sm" id="pdClose">Tutup</button></div>
  <div class="db">
    <img class="preview" id="pdPrev" alt="" hidden>
    <label>Foto produk <small>(otomatis dikecilkan)</small><input class="in" id="pdFile" type="file" accept="image/*"></label>
    <label>Nama produk<input class="in" id="pdName"></label>
    <div class="two">
      <label>Kategori<input class="in" id="pdCat" list="catList" placeholder="mis. Nugget & Sosis"><datalist id="catList"></datalist></label>
      <label>Ukuran / isi<input class="in" id="pdUnit" placeholder="mis. 500 gr / isi 20"></label>
    </div>
    <div class="two">
      <label>Harga (Rp)<input class="in" id="pdPrice" type="number" min="0"></label>
      <label>Harga coret <small>(opsional)</small><input class="in" id="pdCompare" type="number" min="0"></label>
    </div>
    <div class="two">
      <label>Stok<input class="in" id="pdStock" type="number" min="0"></label>
      <label>Penyimpanan
        <select class="in" id="pdStorage"><option value="frozen">Beku (-18°C)</option><option value="chilled">Dingin</option><option value="dry">Siap saji / kering</option></select>
      </label>
    </div>
    <label>Deskripsi<textarea class="in" id="pdDesc"></textarea></label>
    <label>Cara simpan &amp; masak<textarea class="in" id="pdTips" placeholder="mis. Simpan di freezer. Goreng 5 menit api sedang."></textarea></label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pdActive" checked> Tampilkan di toko</label>
    <div class="row" style="margin:0"><button class="btn red" id="pdSave">Simpan produk</button><span class="err" id="pdErr"></span></div>
  </div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { firebaseConfig, API_BASE } from './js/firebase-config.js';
if (/ISI/.test(JSON.stringify(firebaseConfig))) {
  window.__showBootError('File public/js/firebase-config.js belum diisi (masih berisi kata ISI). Isi config Firebase dari Project settings, lalu commit.');
  throw new Error('firebase-config belum diisi');
}
const IMG = (u) => (u && u.startsWith('/') ? API_BASE + u : u || '');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);

// Panggil endpoint Vercel dengan token login admin
async function adminApi(path, body, isBinary = false) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(API_BASE + '/api/' + path, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': isBinary ? 'application/octet-stream' : 'application/json' },
    body: isBinary ? body : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || (res.status === 404 || res.status === 405 ? 'Back end belum tersambung (butuh Netlify).' : 'Terjadi kesalahan.'));
  return data;
}

const $ = (s) => document.querySelector(s);
const rp = (n) => 'Rp' + Math.round(n || 0).toLocaleString('id-ID');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tt; const toast = (m) => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2800); };

/* ---------- auth ---------- */
let unsubs = [];
onAuthStateChanged(auth, async (user) => {
  unsubs.forEach((u) => u()); unsubs = [];
  if (!user) { $('#appView').hidden = true; $('#loginView').hidden = false; return; }
  let isAdmin = false;
  try { isAdmin = (await getDoc(doc(db, 'admins', user.uid))).exists(); } catch {}
  if (!isAdmin) {
    $('#loginErr').innerHTML = `Akun ini belum terdaftar sebagai admin.<br>Buat dokumen <b>admins/${esc(user.uid)}</b> di Firestore Console, lalu masuk lagi.`;
    await signOut(auth); $('#loginView').hidden = false; $('#appView').hidden = true; return;
  }
  $('#loginView').hidden = true; $('#appView').hidden = false;
  start();
});
$('#loginBtn').onclick = async () => {
  $('#loginErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#pass').value); }
  catch { $('#loginErr').textContent = 'Email atau kata sandi salah.'; }
};
$('#pass').addEventListener('keydown', (e) => e.key === 'Enter' && $('#loginBtn').click());
$('#logoutBtn').onclick = () => signOut(auth);

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', x === b));
  ['orders', 'products', 'settings'].forEach((t) => ($('#tab-' + t).hidden = t !== b.dataset.tab));
});

/* ---------- start listeners ---------- */
let orders = [], products = [], settings = {};
function start() {
  unsubs.push(onSnapshot(query(collection(db, 'orders'), orderBy('createdAt', 'desc'), limit(150)), (s) => { orders = s.docs.map((d) => ({ id: d.id, ...d.data() })); paintOrders(); }, (e) => toast('Gagal memuat pesanan: ' + e.code)));
  unsubs.push(onSnapshot(collection(db, 'products'), (s) => { products = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '')); paintProducts(); }));
  unsubs.push(onSnapshot(doc(db, 'settings', 'store'), (s) => { settings = s.exists() ? s.data() : {}; paintSettings(); $('#barName').textContent = (settings.storeName || 'Toko') + ' · Admin'; }));
}

/* ---------- orders ---------- */
const PAY = { pending: ['Belum bayar', 'wait'], paid: ['Lunas', 'ok'], expired: ['Kedaluwarsa', 'bad'], failed: ['Gagal', 'bad'], cancelled: ['Dibatalkan', 'bad'] };
const FUL = ['baru', 'diproses', 'dikirim', 'selesai'];
const FULL = { baru: 'Baru', diproses: 'Diproses', dikirim: 'Dikirim', selesai: 'Selesai', batal: 'Batal' };

function matchFilter(o, f) {
  if (f === 'all') return true;
  if (f === 'todo') return o.paymentStatus === 'paid' && (o.fulfillment === 'baru' || o.fulfillment === 'diproses');
  if (f === 'unpaid') return o.paymentStatus === 'pending' && o.fulfillment !== 'batal';
  if (f === 'batal') return o.fulfillment === 'batal';
  return o.fulfillment === f;
}
function paintOrders() {
  const f = $('#ordFilter').value;
  const list = orders.filter((o) => matchFilter(o, f));
  $('#ordCount').textContent = list.length + ' pesanan';
  $('#ordList').innerHTML = list.length ? list.map((o) => {
    const [pl, pc] = PAY[o.paymentStatus] || [o.paymentStatus, ''];
    const c = o.customer || {};
    const when = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    const wa = `https://wa.me/${c.phone}?text=${encodeURIComponent(`Halo ${c.name}, pesanan ${o.orderId} `)}`;
    const closed = o.fulfillment === 'batal';
    return `<div class="card ord">
      <div class="ord-h"><strong>${esc(o.orderId)}</strong><span class="pill ${pc}">${esc(pl)}</span><span class="pill">${esc(FULL[o.fulfillment] || o.fulfillment)}</span>${o.needsReview ? '<span class="pill bad">Perlu dicek</span>' : ''}<span class="muted">${when}</span></div>
      <div><b>${esc(c.name)}</b> · ${esc(c.phone)}<br><span class="muted">${esc(c.area)} — ${esc(c.address)}${c.note ? '<br>Catatan: ' + esc(c.note) : ''}</span></div>
      <ul>${(o.items || []).map((l) => `<li>${esc(l.name)} × ${l.qty} <span class="muted">(${rp(l.price * l.qty)})</span></li>`).join('')}</ul>
      <div><b>Total ${rp(o.total)}</b> <span class="muted">(ongkir ${rp(o.shipping)})${o.paymentType ? ' · ' + esc(o.paymentType) : ''}</span></div>
      <div class="acts">
        <select class="in" data-ful="${o.id}" ${closed ? 'disabled' : ''}>${FUL.map((s) => `<option value="${s}" ${o.fulfillment === s ? 'selected' : ''}>${FULL[s]}</option>`).join('')}${closed ? '<option selected>Batal</option>' : ''}</select>
        <a class="btn ghost sm" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp</a>
        ${closed ? '' : `<button class="btn ghost sm" data-cancel="${o.id}">Batalkan</button>`}
      </div></div>`;
  }).join('') : '<div class="card muted">Belum ada pesanan di filter ini.</div>';
}
$('#ordFilter').onchange = paintOrders;
$('#ordList').addEventListener('change', async (e) => {
  const id = e.target.dataset.ful; if (!id) return;
  const o = orders.find((x) => x.id === id);
  if (o.paymentStatus !== 'paid') { toast('Status pengiriman bisa diubah setelah pesanan dibayar.'); paintOrders(); return; }
  try { await updateDoc(doc(db, 'orders', id), { fulfillment: e.target.value, updatedAt: serverTimestamp() }); toast('Status diperbarui'); }
  catch { toast('Gagal memperbarui status'); }
});
$('#ordList').addEventListener('click', async (e) => {
  const id = e.target.dataset.cancel; if (!id) return;
  const o = orders.find((x) => x.id === id);
  const extra = o.paymentStatus === 'paid' ? '\n\nPesanan ini SUDAH DIBAYAR. Refund harus dilakukan manual di dashboard Midtrans.' : '';
  if (!confirm(`Batalkan pesanan ${id}? Stok akan dikembalikan.${extra}`)) return;
  try { await adminApi('admin-cancel', { orderId: id }); toast('Pesanan dibatalkan'); } catch (err) { toast(err.message || 'Gagal membatalkan'); }
});

/* ---------- products ---------- */
function paintProducts() {
  $('#prodCount').textContent = products.length + ' produk';
  $('#catList').innerHTML = [...new Set(products.map((p) => p.category).filter(Boolean))].map((c) => `<option value="${esc(c)}">`).join('');
  $('#prodBody').innerHTML = products.length ? products.map((p) => `<tr>
    <td>${p.imageUrl ? `<img src="${esc(IMG(p.imageUrl))}" alt="">` : '<div class="th"></div>'}</td>
    <td><b>${esc(p.name)}</b><div class="muted">${esc(p.category || '')} · ${esc(p.unit || '')}</div></td>
    <td>${rp(p.price)}</td>
    <td><input class="in" style="width:80px" type="number" min="0" value="${p.stock ?? 0}" data-stock="${p.id}" aria-label="Stok ${esc(p.name)}"></td>
    <td><span class="pill ${p.active ? 'ok' : ''}">${p.active ? 'Tampil' : 'Disembunyikan'}</span></td>
    <td style="white-space:nowrap"><button class="btn ghost sm" data-edit="${p.id}">Ubah</button> <button class="btn ghost sm" data-del="${p.id}">Hapus</button></td>
  </tr>`).join('') : '<tr><td colspan="6" class="muted">Belum ada produk. Klik "Tambah produk" atau "Isi contoh produk".</td></tr>';
}
$('#prodBody').addEventListener('change', async (e) => {
  const id = e.target.dataset.stock; if (!id) return;
  const v = Math.max(0, Math.floor(Number(e.target.value) || 0));
  try { await updateDoc(doc(db, 'products', id), { stock: v, updatedAt: serverTimestamp() }); toast('Stok disimpan'); } catch { toast('Gagal menyimpan stok'); }
});
$('#prodBody').addEventListener('click', async (e) => {
  if (e.target.dataset.edit) openProd(products.find((p) => p.id === e.target.dataset.edit));
  if (e.target.dataset.del) {
    const p = products.find((x) => x.id === e.target.dataset.del);
    if (confirm(`Hapus "${p.name}" permanen? Untuk menyembunyikan saja, ubah produk lalu matikan "Tampilkan di toko".`)) { await deleteDoc(doc(db, 'products', p.id)); toast('Produk dihapus'); }
  }
});

let editing = null, newImageBlob = null;
function openProd(p) {
  editing = p || null; newImageBlob = null;
  $('#pdTitle').textContent = p ? 'Ubah produk' : 'Produk baru';
  $('#pdName').value = p?.name || ''; $('#pdCat').value = p?.category || ''; $('#pdUnit').value = p?.unit || '';
  $('#pdPrice').value = p?.price ?? ''; $('#pdCompare').value = p?.comparePrice || ''; $('#pdStock').value = p?.stock ?? 0;
  $('#pdStorage').value = p?.storage || 'frozen'; $('#pdDesc').value = p?.description || ''; $('#pdTips').value = p?.storageTips || '';
  $('#pdActive').checked = p ? !!p.active : true; $('#pdFile').value = ''; $('#pdErr').textContent = '';
  $('#pdPrev').hidden = !p?.imageUrl; if (p?.imageUrl) $('#pdPrev').src = IMG(p.imageUrl);
  $('#prodDlg').showModal();
}
$('#addProd').onclick = () => openProd(null);
$('#pdClose').onclick = () => $('#prodDlg').close();

function resizeImage(file, max = 900) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error('resize')); }, 'image/jpeg', 0.82);
    };
    img.onerror = () => reject(new Error('Gambar tidak bisa dibaca'));
    img.src = url;
  });
}
$('#pdFile').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { newImageBlob = await resizeImage(f); $('#pdPrev').src = URL.createObjectURL(newImageBlob); $('#pdPrev').hidden = false; }
  catch (err) { $('#pdErr').textContent = err.message; }
};
$('#pdSave').onclick = async () => {
  const name = $('#pdName').value.trim(), price = Math.round(Number($('#pdPrice').value));
  if (!name) return ($('#pdErr').textContent = 'Nama produk wajib diisi.');
  if (!(price > 0)) return ($('#pdErr').textContent = 'Harga harus lebih dari 0.');
  const btn = $('#pdSave'); btn.disabled = true; $('#pdErr').textContent = '';
  try {
    const data = {
      name, category: $('#pdCat').value.trim(), unit: $('#pdUnit').value.trim(), price,
      comparePrice: Math.round(Number($('#pdCompare').value)) || 0,
      stock: Math.max(0, Math.floor(Number($('#pdStock').value) || 0)),
      storage: $('#pdStorage').value, description: $('#pdDesc').value.trim(), storageTips: $('#pdTips').value.trim(),
      active: $('#pdActive').checked, updatedAt: serverTimestamp(),
    };
    const docRef = editing ? doc(db, 'products', editing.id) : doc(collection(db, 'products'));
    if (newImageBlob) {
      data.imageUrl = (await adminApi('upload', newImageBlob, true)).url;
    }
    if (editing) await updateDoc(docRef, data); else await setDoc(docRef, { ...data, createdAt: serverTimestamp() });
    $('#prodDlg').close(); toast('Produk disimpan');
  } catch (e) { console.error(e); $('#pdErr').textContent = 'Gagal menyimpan: ' + (e.message || e.code); }
  btn.disabled = false;
};

$('#seedProd').onclick = async () => {
  if (!confirm('Tambahkan 8 produk contoh (tanpa foto)? Anda bisa mengubah atau menghapusnya nanti.')) return;
  for (const [name, category, unit, price, comparePrice, stock, storage, description, storageTips] of SAMPLES) {
    await addDoc(collection(db, 'products'), { name, category, unit, price, comparePrice, stock, storage, description, storageTips, active: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  }

};

/* ---------- settings ---------- */
function paintSettings() {
  const s = settings;
  if (document.activeElement && document.activeElement.closest('#tab-settings')) return; // jangan timpa saat mengetik
  $('#sName').value = s.storeName || ''; $('#sTag').value = s.tagline || ''; $('#sSub').value = s.subline || '';
  $('#sAnn').value = s.announcement || ''; $('#sNote').value = s.deliveryNote || ''; $('#sWa').value = s.whatsapp || '';
  $('#sMin').value = s.minOrder || 0; $('#sFree').value = s.freeShippingMin || 0;
  $('#sAreas').value = (s.shippingAreas || []).map((a) => `${a.name} | ${a.fee}`).join('\n');
}
$('#saveSettings').onclick = async () => {
  $('#sErr').textContent = '';
  const areas = $('#sAreas').value.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
    const [name, fee] = l.split('|').map((x) => x.trim());
    return { name, fee: Math.max(0, Math.round(Number(String(fee || '0').replace(/\D/g, '')) || 0)) };
  }).filter((a) => a.name);
  if (!areas.length) return ($('#sErr').textContent = 'Isi minimal satu area pengiriman.');
  try {
    await setDoc(doc(db, 'settings', 'store'), {
      storeName: $('#sName').value.trim() || 'Toko Frozen', tagline: $('#sTag').value.trim(), subline: $('#sSub').value.trim(),
      announcement: $('#sAnn').value.trim(), deliveryNote: $('#sNote').value.trim(), whatsapp: $('#sWa').value.replace(/\D/g, ''),
      minOrder: Math.max(0, Math.round(Number($('#sMin').value) || 0)), freeShippingMin: Math.max(0, Math.round(Number($('#sFree').value) || 0)),
      shippingAreas: areas, updatedAt: serverTimestamp(),
    });
    toast('Pengaturan disimpan');
  } catch (e) { $('#sErr').textContent = 'Gagal menyimpan: ' + (e.code || e.message); }
};
