name: Unpack zip
on:
  push:
    paths: ['isi-repo.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -qo isi-repo.zip -x '__MACOSX/*'
          rm isi-repo.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack isi-repo.zip"
          git push
