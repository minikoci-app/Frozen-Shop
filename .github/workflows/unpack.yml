name: Unpack zip

on:
  push:
    paths:
      - 'isi-repo.zip'
      - '.github/workflows/unpack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip dan commit
        run: |
          if [ ! -f isi-repo.zip ]; then
            echo "isi-repo.zip tidak ditemukan. Upload dulu ke halaman utama repo."
            exit 1
          fi
          unzip -qo isi-repo.zip -x '__MACOSX/*'
          rm isi-repo.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack isi-repo.zip"
          git push
